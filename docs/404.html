<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <meta name = "robots" content = "noindex">
    <meta name = "color-scheme" content = "light dark">

    <!-- Use the visitor's saved theme (set on the main page) -->
    <script>
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
        } catch (error) {}
    </script>

    <title> Page not found | Bin Shaya'a Furniture </title>

    <!-- Paths start with "/" because GitHub shows this page at any broken address -->
    <link rel = "icon" href = "/assets/images/logo-96.png" type = "image/png" sizes = "96x96">

    <!-- Google Fonts -->
    <link rel = "preconnect" href = "https://fonts.googleapis.com">
    <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
    <link href = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600..700&display=swap" rel = "stylesheet">

    <link rel = "stylesheet" href = "/css/style.css">

</head>
<body>

    <main class = "error-page">
        <div class = "container">

            <a href = "/" class = "logo error-logo">
                <img src = "/assets/images/logo-96.png" class = "logo-img" alt = "" width = "96" height = "96">
                <span class = "logo-text"> Bin Shaya'a </span>
            </a>

            <p class = "error-code" aria-hidden = "true"> 404 </p>
            <h1> Page not found </h1>
            <p class = "error-text"> The page you're looking for doesn't exist or may have moved. </p>

            <div class = "hero-actions error-actions">
                <a href = "/" class = "btn btn-primary"> Back to home </a>
                <a href = "/#contact" class = "btn btn-outline"> Contact us </a>
            </div>

            <p class = "error-text error-text-ar" lang = "ar" dir = "rtl">
                الصفحة غير موجودة. <a href = "/ar/" class = "text-link"> العودة إلى الصفحة الرئيسية &larr;</a>
            </p>

        </div>
    </main>

</body>
</html>
